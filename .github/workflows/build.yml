name: Compilar DotaPeonCoach

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar librerias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Empaquetar carpeta portable sin bloqueos
      run: |
        pyinstaller --onedir --add-data "voz_peon.wav;." --name "DotaPeonCoach" main.py

    - name: Subir programa listo para descargar
      uses: actions/upload-artifact@v4
      with:
        name: DotaPeonCoach-Windows
        path: dist/DotaPeonCoach
